  ],

  ],

  ],

    <!-- Structured data: FAQ (mirrors the on-page FAQ section) -->
    <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "Czy GlitchSoul jest darmowy?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Tak. Cała gra — lochy, bossowie, arena PvP, krypta, gildie i wojny gildii — jest dostępna bez żadnych opłat. Nie ma abonamentu ani treści zamkniętych za płatnością."
      }
    },
    {
      "@type": "Question",
      "name": "Czy da się kupić przewagę za pieniądze?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Nie. W GlitchSoul nie sprzedajemy statystyk, przedmiotów ani poziomów. Gemy, czyli waluta premium, zdobywa się grając — za codzienne logowanie, serie dni, awanse i wydarzenia. Konto darmowe ma dokładnie te same możliwości co każde inne."
      }
    },
    {
      "@type": "Question",
      "name": "Czy muszę coś instalować?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Nie. Gra działa w przeglądarce na telefonie i komputerze. Jeśli wolisz aplikację, możesz dodatkowo pobrać wersję na Androida (plik APK)."
      }
    },
    {
      "@type": "Question",
      "name": "Czy potrzebuję konta?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Tak, założenie konta zajmuje około 30 sekund i wymaga tylko adresu e-mail. Dzięki temu postęp zapisuje się w chmurze i możesz grać raz na telefonie, raz na komputerze — na tej samej postaci."
      }
    },
    {
      "@type": "Question",
      "name": "Czy mogę grać z przyjaciółmi?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Tak. Możesz założyć wspólną gildię, bić razem bossa gildyjnego, chodzić na operacje grupowe, toczyć wojny z innymi gildiami i rywalizować w rankingu oraz na arenie PvP."
      }
    },
    {
      "@type": "Question",
      "name": "Ile czasu trzeba grać dziennie?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Tyle, ile chcesz. Dzienne limity wejść do lochów, krypt i zadań sprawiają, że kilkanaście minut dziennie w zupełności wystarczy, żeby nie zostać w tyle."
      }
    },
    {
      "@type": "Question",
      "name": "Czy gra jest po polsku?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Tak, GlitchSoul jest w pełni po polsku i po angielsku. Język przełączysz w każdej chwili przyciskiem PL/EN."
      }
    }
  ]
}
    </script>

    <noscript>
      <h1>GlitchSoul — darmowe cyberpunkowe RPG przeglądarkowe</h1>
      <p>
        GlitchSoul to darmowe RPG w klimacie cyberpunk, w które zagrasz bezpośrednio w przeglądarce
        na telefonie i komputerze, albo przez aplikację na Androida. Czyścisz lochy w 20 lokacjach,
        wspinasz się po drabince 41 bossów, walczysz na arenie PvP, schodzisz do krypty i budujesz
        gildię z innymi graczami.
      </p>
      <h2>Bez pay-to-win</h2>
      <p>
        Nie sprzedajemy mocy: nie ma pakietów ze statystykami, legendarnych przedmiotów za pieniądze
        ani skrótów do poziomów. Gemy zdobywa się grając — za codzienne logowanie, serie dni, awanse
        i wydarzenia. Konto darmowe ma dokładnie te same możliwości co każde inne.
      </p>
      <p>Aby zagrać, włącz obsługę JavaScriptu w przeglądarce.</p>
    </noscript>
