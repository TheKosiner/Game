      <h1>GlitchSoul — RPG cyberpunk gratuit dans le navigateur</h1>
      <p>GlitchSoul est un RPG cyberpunk gratuit auquel tu peux jouer directement dans ton navigateur, sur téléphone comme sur ordinateur, ou via l’application Android. Nettoie des donjons dans 20 lieux, grimpe une échelle de 41 boss, combats dans l’arène PvP, descends dans la crypte et monte une guilde avec d’autres joueurs.</p>
      <h2>Sans pay-to-win</h2>
      <p>Nous ne vendons pas de puissance : pas de packs de caractéristiques, pas d’objets légendaires contre de l’argent, pas de sauts de niveau. Les gemmes se gagnent en jouant. Un compte gratuit a exactement les mêmes possibilités que n’importe quel autre.</p>
      <p>Pour jouer, active JavaScript dans ton navigateur.</p>
