    <noscript>
      <h1>GlitchSoul — kostenloses Cyberpunk-Browser-RPG</h1>
      <p>GlitchSoul ist ein kostenloses Cyberpunk-RPG, das du direkt im Browser auf Handy und PC oder über die Android-App spielen kannst. Räume Dungeons an 20 Orten, klettere eine Leiter aus 41 Bossen hoch, kämpfe in der PvP-Arena, steig in die Krypta hinab und baue mit anderen eine Gilde auf.</p>
      <h2>Kein Pay-to-win</h2>
      <p>Wir verkaufen keine Macht: keine Statuspakete, keine legendären Items für Geld, keine Stufensprünge. Gems werden erspielt. Ein kostenloses Konto hat exakt dieselben Möglichkeiten wie jedes andere.</p>
      <p>Um zu spielen, aktiviere JavaScript in deinem Browser.</p>
