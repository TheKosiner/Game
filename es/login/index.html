      <h1>GlitchSoul — RPG cyberpunk gratis en el navegador</h1>
      <p>GlitchSoul es un RPG cyberpunk gratuito al que puedes jugar directamente en el navegador, en móvil y en ordenador, o mediante la aplicación de Android. Limpia mazmorras en 20 ubicaciones, sube una escalera de 41 jefes, lucha en la arena PvP, baja a la cripta y crea un clan con otros jugadores.</p>
      <h2>Sin pay-to-win</h2>
      <p>No vendemos poder: no hay packs de atributos, ni objetos legendarios por dinero, ni saltos de nivel. Las gemas se ganan jugando. Una cuenta gratuita tiene exactamente las mismas opciones que cualquier otra.</p>
      <p>Para jugar, activa JavaScript en tu navegador.</p>
