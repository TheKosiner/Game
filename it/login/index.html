      <h1>GlitchSoul — GDR cyberpunk gratis nel browser</h1>
      <p>GlitchSoul è un GDR cyberpunk gratuito a cui puoi giocare direttamente nel browser, su telefono e su computer, oppure tramite l’app per Android. Ripulisci dungeon in 20 località, sali una scala di 41 boss, combatti nell’arena PvP, scendi nella cripta e costruisci una gilda con altri giocatori.</p>
      <h2>Niente pay-to-win</h2>
      <p>Non vendiamo potenza: niente pacchetti di statistiche, niente oggetti leggendari a pagamento, niente salti di livello. Le gemme si guadagnano giocando. Un account gratuito ha esattamente le stesse possibilità di qualsiasi altro.</p>
      <p>Per giocare, attiva JavaScript nel browser.</p>
