name: Build for Google Play

# Builds the Google Play edition (VITE_DISTRIBUTION=play: Play Billing, no
# GitHub self-update) as a signed App Bundle and attaches it to the run.
# Upload it in Play Console (Test and release → a track → Create new release).
# Run manually: Actions → "Build for Google Play" → Run workflow.
on:
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci

      - name: Build web app (Play edition)
        run: npm run build
        env:
          VITE_DISTRIBUTION: play
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - run: npx cap sync android

      - name: Install Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null

      # Play requires every upload to have a higher versionCode. Minutes since the
      # Unix epoch always increase and stay above the GitHub APK's run numbers, so
      # players moving from the APK to the Play version get it as an update.
      - name: Set version
        run: |
          VERSION_CODE=$(( $(date +%s) / 60 ))
          VERSION_NAME="$(date +'%Y.%m.%d')-$(echo '${{ github.sha }}' | cut -c1-7)"
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION_NAME\"/" android/app/build.gradle
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Building versionCode $VERSION_CODE ($VERSION_NAME)"

      - name: Decode upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set — Google Play needs a signed bundle."
            exit 1
          fi
          umask 077
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/glitchsoul.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/glitchsoul.keystore" >> "$GITHUB_ENV"

      - name: Build signed App Bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew bundleRelease --no-daemon
          AAB=$(find app/build/outputs/bundle/release -name '*.aab' | head -1)
          echo "Built $AAB"
          cp "$AAB" "$GITHUB_WORKSPACE/GlitchSoul-play-$VERSION_CODE.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: GlitchSoul-play-${{ env.VERSION_CODE }}
          path: GlitchSoul-play-${{ env.VERSION_CODE }}.aab
          retention-days: 90

      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/glitchsoul.keystore"
