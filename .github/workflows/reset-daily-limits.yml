name: Reset Daily Limits (Admin)

on:
  push:
    branches:
      - run/reset-daily-limits
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install firebase-admin
        run: npm install firebase-admin --no-save

      # Passed through the environment rather than pasted into the script, so a
      # quote inside the JSON can't break (or inject into) the shell command.
      - name: Write service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/sa.json

      - name: Run reset script
        run: node reset-daily-limits.mjs /tmp/sa.json

      - name: Cleanup
        if: always()
        run: rm -f /tmp/sa.json
