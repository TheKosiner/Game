      <h1>GlitchSoul — RPG cyberpunk grátis no navegador</h1>
      <p>O GlitchSoul é um RPG cyberpunk gratuito que você joga direto no navegador, no celular e no computador, ou pelo aplicativo Android. Limpe masmorras em 20 locais, suba uma escada de 41 chefes, lute na arena PvP, desça à cripta e monte uma guilda com outros jogadores.</p>
      <h2>Sem pay-to-win</h2>
      <p>Não vendemos poder: não há pacotes de atributos, nem itens lendários por dinheiro, nem atalhos de nível. As gemas são conquistadas jogando. Uma conta gratuita tem exatamente as mesmas opções de qualquer outra.</p>
      <p>Para jogar, ative o JavaScript no seu navegador.</p>
