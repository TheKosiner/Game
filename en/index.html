<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Block Google Translate — it rewrites React-managed text nodes into <font> tags,
         causing removeChild crashes for players with auto-translate enabled -->
    <meta name="google" content="notranslate" />

    <title>GlitchSoul — free cyberpunk browser RPG with no pay-to-win</title>
    <meta name="description" content="GlitchSoul is a free cyberpunk RPG for browser and Android. Dungeons, 41 bosses, PvP arena, the crypt, guilds and guild wars. Zero pay-to-win — we do not sell power or items. Play free in English." />
    <link rel="canonical" href="https://glitchsoul.com/en/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="apple-mobile-web-app-title" content="GlitchSoul" />

    <!-- Language alternates -->
    <link rel="alternate" hreflang="pl" href="https://glitchsoul.com/" />
    <link rel="alternate" hreflang="en" href="https://glitchsoul.com/en/" />
    <link rel="alternate" hreflang="x-default" href="https://glitchsoul.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GlitchSoul" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="pl_PL" />
    <meta property="og:url" content="https://glitchsoul.com/en/" />
    <meta property="og:title" content="GlitchSoul — free cyberpunk RPG with no pay-to-win" />
    <meta property="og:description" content="Dungeons, 41 bosses, PvP arena, the crypt and guilds. A free browser and Android RPG where you cannot buy an advantage. Made by a player, for players." />
    <meta property="og:image" content="https://glitchsoul.com/og-image.webp" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="GlitchSoul — cyberpunk browser RPG" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GlitchSoul — free cyberpunk RPG with no pay-to-win" />
    <meta name="twitter:description" content="Dungeons, 41 bosses, PvP arena, the crypt and guilds. A free browser and Android RPG where you cannot buy an advantage. Made by a player, for players." />
    <meta name="twitter:image" content="https://glitchsoul.com/og-image.webp" />

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

    <!-- Structured data: the game itself -->
    <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "VideoGame",
  "name": "GlitchSoul",
  "url": "https://glitchsoul.com/en/",
  "image": "https://glitchsoul.com/og-image.webp",
  "description": "A free cyberpunk browser RPG with no pay-to-win. Dungeons, 41 bosses, PvP arena, the crypt, guilds and guild wars. Playable in the browser and as an Android app.",
  "inLanguage": [
    "pl",
    "en"
  ],
  "genre": [
    "RPG",
    "MMORPG",
    "Browser game",
    "Cyberpunk"
  ],
  "gamePlatform": [
    "Web browser",
    "Android"
  ],
  "playMode": [
    "SinglePlayer",
    "MultiPlayer"
  ],
  "applicationCategory": "Game",
  "operatingSystem": "Web, Android",
  "offers": {
    "@type": "Offer",
    "price": "0",
    "priceCurrency": "USD",
    "availability": "https://schema.org/InStock"
  }
}
    </script>

    <!-- Structured data: FAQ (mirrors the on-page FAQ section) -->
    <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "Is GlitchSoul free?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. The whole game — dungeons, bosses, PvP arena, the crypt, guilds and guild wars — is available at no cost. There is no subscription and no content locked behind payment."
      }
    },
    {
      "@type": "Question",
      "name": "Can you buy an advantage with money?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. GlitchSoul does not sell stats, items or levels. Gems, the premium currency, are earned by playing — daily logins, streaks, level-ups and events. A free account has exactly the same options as any other."
      }
    },
    {
      "@type": "Question",
      "name": "Do I need to install anything?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. The game runs in your browser on phone and desktop. If you prefer an app, you can additionally download the Android version (an APK file)."
      }
    },
    {
      "@type": "Question",
      "name": "Do I need an account?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes, and it takes about 30 seconds — just an email address. That way your progress is stored in the cloud and you can play on your phone and your computer with the same character."
      }
    },
    {
      "@type": "Question",
      "name": "Can I play with friends?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. You can start a guild together, fight the guild boss as a team, run group operations, wage war on other guilds and compete on the leaderboard and in the PvP arena."
      }
    },
    {
      "@type": "Question",
      "name": "How much time does it take per day?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "As much as you want. Daily caps on dungeons, crypts and quests mean fifteen minutes a day is plenty to stay competitive."
      }
    },
    {
      "@type": "Question",
      "name": "What languages are supported?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "GlitchSoul is fully translated into English and Polish. You can switch at any time with the PL/EN button."
      }
    }
  ]
}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="modal-root"></div>
    <noscript>
      <h1>GlitchSoul — a free cyberpunk browser RPG</h1>
      <p>
        GlitchSoul is a free cyberpunk RPG you can play straight in your browser on phone and
        desktop, or through the Android app. Clear dungeons across 20 locations, climb a ladder of
        41 bosses, fight in the PvP arena, descend into the crypt and build a guild with other players.
      </p>
      <h2>No pay-to-win</h2>
      <p>
        We do not sell power: no stat bundles, no legendary items for cash, no level skips. Gems are
        earned by playing — daily logins, streaks, level-ups and events. A free account has exactly
        the same options as any other.
      </p>
      <p>To play, enable JavaScript in your browser.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
